services:
  mlflow-server:
    build: .
    container_name: recsys-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////app/mlflow_store/mlflow.db
      --default-artifact-root /app/mlflow_store/mlruns
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_store:/app/mlflow_store
      - ./shared_data:/app/shared_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  recsys-api:
    build: .
    container_name: recsys-api
    depends_on:
      mlflow-server:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - DATA_DIR=/app/shared_data
      - FRONTEND_DIR=/app/frontend
    volumes:
      - ./shared_data:/app/shared_data
      - ./mlflow_store:/app/mlflow_store
      - ./docs:/app/docs
    ports:
      - "8000:8000"
    command: >
      sh -c "if [ ! -f /app/shared_data/products.parquet ]; then python src/prepare_data.py --source synthetic; fi &&
      uvicorn api:app --app-dir src --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  prefect-orchestrator:
    build: .
    container_name: recsys-prefect
    depends_on:
      mlflow-server:
        condition: service_healthy
      recsys-api:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - API_BASE_URL=http://recsys-api:8000
      - DATA_DIR=/app/shared_data
    volumes:
      - ./shared_data:/app/shared_data
      - ./mlflow_store:/app/mlflow_store
      - ./docs:/app/docs
    command: python src/flow_retrain.py --serve

  frontend:
    build: ./frontend
    container_name: recsys-frontend
    depends_on:
      recsys-api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: recsys-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      recsys-api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: recsys-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
