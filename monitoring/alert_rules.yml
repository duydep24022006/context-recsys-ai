groups:
  - name: recsys_sla_alerts
    rules:
      - alert: HighRecommendLatencyP95
        expr: histogram_quantile(0.95, sum(rate(recsys_latency_seconds_bucket[5m])) by (le)) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High p95 /recommend latency (> 100ms)"
          description: "p95 latency has exceeded the 100ms SLA for more than 1 minute."

      - alert: HighApiErrorRate
        expr: sum(rate(recsys_errors_total[5m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Elevated API error rate on recsys-api"
          description: "API error rate exceeded 0.05 errors/sec over the last 5 minutes."
